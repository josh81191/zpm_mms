# Apache virtual host for the ZPM Member Registry (Ubuntu/Debian paths).
# Needs: a2enmod rewrite headers ssl ; PHP 8.1+ with pdo_pgsql, mbstring.
# Issue the certificate first, e.g.: certbot certonly --apache -d registry.example.org

<VirtualHost *:80>
    ServerName registry.example.org
    Redirect permanent / https://registry.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName registry.example.org
    DocumentRoot /var/www/zpm/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/registry.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/registry.example.org/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"

    <Directory /var/www/zpm/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/zpm_error.log
    CustomLog ${APACHE_LOG_DIR}/zpm_access.log combined
</VirtualHost>
